[project]
name = "rpg-project"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi[standard]>=0.116",
    "uvicorn>=0.35",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.5",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy"
]
